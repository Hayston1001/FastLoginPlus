plugins { id 'com.gradleup.shadow' }
// Lowest JRE that can load this artifact - keep in sync with the module table in CONTRIBUTING.md.
ext.javaFloor = 17
apply from: rootProject.file('gradle/bedrock.gradle')

dependencies {
    implementation(project(':core')) {
        exclude group: 'net.md-5', module: 'bungeecord-config'
        exclude group: 'com.google.code.gson', module: 'gson'
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'org.yaml', module: 'snakeyaml'
    }
    compileOnly(libs.bungeecord.api) {
        exclude group: 'net.md-5', module: 'bungeecord-protocol'
        exclude group: 'io.netty'
        exclude group: 'org.yaml', module: 'snakeyaml'
    }
    compileOnly libs.bungeecord.event
    compileOnly files('lib/BungeeAuth-1.4.jar')
    testImplementation files('lib/bungeecord-proxy-1.20-R0.2-20240119.213723-10.jar')
    testImplementation(libs.bungeecord.protocol) { exclude group: 'io.netty' }
    testImplementation libs.bungeecord.log
    testImplementation libs.snakeyaml
    testImplementation libs.netty.handler
    implementation libs.sqlite.driver
}
configurations.testImplementation.extendsFrom(configurations.compileOnly)
tasks.named('test') {
    // Opt-in check against a real, current proxy jar: ./gradlew :bungee:test -Pflp.proxy.jar=<jar>
    systemProperty 'flp.proxy.jar', providers.gradleProperty('flp.proxy.jar').orElse('').get()
}
// Proxy-bundled baseline versions for the test classpath: see gradle/proxy-baseline.gradle.
apply from: rootProject.file('gradle/proxy-baseline.gradle')

tasks.named('shadowJar') {
    filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    relocate 'com.zaxxer.hikari', 'fastlogin.hikari'
    relocate 'org.slf4j', 'fastlogin.slf4j'
    mergeServiceFiles()
    minimize {
        // Bundled as-is, like the Maven build did: it exempted sqlite-jdbc from
        // minimization with an <includes>**</includes> filter.
        exclude(dependency('org.xerial:sqlite-jdbc:.*'))
        // The provider is named only in META-INF/services, so the minimizer cannot see
        // it - see platform-common.gradle for the same reasoning.
        exclude(dependency('org.slf4j:.*:.*'))
    }
    exclude '**/module-info.class'
}
