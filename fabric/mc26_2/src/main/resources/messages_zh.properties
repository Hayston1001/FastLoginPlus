# UTF-8 player messages.
ownership-conflict=FastLoginPlus: 此账号与本次连接的认证身份不符. 请使用正确的账号重新连接, 或联系管理员.
rename-conflict=FastLoginPlus: 多个 EasyAuth 账号与您的认证身份匹配. 请联系管理员处理重复账号后再重新连接.
rename-failed=FastLoginPlus: EasyAuth 未能完成账号改名跟随. 请稍后重新连接; 若仍失败, 请管理员检查后端日志和存储.
invalid-identity=FastLoginPlus: 代理身份声明缺失或无效. 请通过受信任的代理重新连接; 若仍失败, 请联系管理员.
bedrock-unsupported=FastLoginPlus: Fabric 模式不支持基岩版/Floodgate 连接. 请使用 Minecraft Java 版加入.
auth-unavailable=FastLoginPlus: EasyAuth 账号校验或保存失败. 请重新连接后重试; 若仍失败, 请管理员检查后端日志和 EasyAuth 配置.
binding-login-required=FastLoginPlus: 请先登录 EasyAuth 密码账号, 然后执行 /flp premium.
binding-identity-required=FastLoginPlus: 本次连接缺少可用的正版或离线身份. 请通过受信任的代理重新连接后重试 /flp premium.
binding-password-required=FastLoginPlus: 绑定需要已有的密码账号. 若已转正, 请重新连接以免密登录; 否则请联系管理员.
binding-account-saving=FastLoginPlus: 密码账号尚未保存完成. 本次未修改账号, 请稍后重试 /flp premium.
binding-save-failed=FastLoginPlus: EasyAuth 未能确认绑定保存成功. 内存中的密码账号已还原; 请管理员检查存储后再重试 /flp premium.
binding-account-changed=FastLoginPlus: 绑定期间账号发生变化. 本次尝试未修改账号; 请用当前密码登录后重试 /flp premium.
binding-checking=FastLoginPlus: 正在查询此名字的正版身份...
binding-name-unavailable=FastLoginPlus: 暂时无法查询此名字的正版身份. 原密码保持不变, 请稍后重试 /flp premium.
admin-premium-permission=FastLoginPlus: 为其他玩家开启正版登录需要操作员等级 2.
admin-premium-no-carrier=FastLoginPlus: 当前没有在线玩家可向代理转发同意. 请在有玩家连接时重试.
admin-premium-already=FastLoginPlus: {player} 已绑定正版. 本次未发送请求.
admin-premium-open=FastLoginPlus: 已为 {player} 发送正版同意请求, 未建立绑定队列. 下次登录遵循代理及 EasyAuth 的注册策略. 若仍在线, 需要重新连接; 是否踢出由代理决定.
admin-premium-queued=FastLoginPlus: 已为 {player} 发送正版同意请求并在本后端排队绑定, UUID 为 {uuid}, 窗口为十分钟. 在此后端经正版验证重连成功前, 原密码不变. 是否踢出由代理决定; 未踢出时需要手动重连. 后端重启会丢失队列.
admin-premium-name-unavailable=FastLoginPlus: 无法查询 {player} 的正版 UUID. 本次未发送请求, 请稍后重试.
admin-premium-changed=FastLoginPlus: 查询期间 {player} 的账号发生变化. 本次未发送请求, 请核对当前账号后重试.
binding-requested=FastLoginPlus: 绑定请求已发出, 目标 UUID 为 {uuid}. 若出现确认提示, 请再执行一次 /flp premium. 然后重新连接以完成正版免密登录. 成功前原密码不变. 若十分钟窗口过期或后端重启, 请用密码登录后重新执行 /flp premium.
binding-saved-reconnect=FastLoginPlus: 绑定已保存, 但本次登录未能完成. 请使用正版账号重新连接以免密登录.
binding-window-unavailable=FastLoginPlus: 绑定窗口已过期, 因后端重启丢失, 或尚未完成. 此账号仍使用密码登录. 请先用原密码登录, 再执行 /flp premium 当场绑定.
binding-consent-required=FastLoginPlus: 此名字尚未切换成正版免密登录. 请先用原密码登录, 再执行 /flp premium 完成绑定.
premium-policy-disabled=FastLoginPlus: 服务器策略已关闭正版自动登录. 已绑定正版的账号没有可用密码, 请联系管理员或按服务器策略重新设置密码. 其他账号仍使用 EasyAuth 的密码登录或注册流程.
registration-required=FastLoginPlus: 自动建档已关闭. 请先通过 EasyAuth 注册并登录, 再执行 /flp premium 绑定.
authenticated=已通过 FastLoginPlus 完成认证.
same-name-cracked-recorded=你的账号已被记录为盗版. 你是正版玩家吗? 如被误判可使用 /flp premium 重新发起验证
