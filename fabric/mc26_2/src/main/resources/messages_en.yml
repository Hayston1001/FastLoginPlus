# UTF-8 player messages. Missing or blank overrides fall back to bundled values.

ownership-conflict: "FastLoginPlus: this account does not match this connection's verified identity. Reconnect with the correct account or contact an admin."
rename-conflict: "FastLoginPlus: multiple EasyAuth accounts match your verified identity. Contact an admin to resolve the duplicate accounts before reconnecting."
rename-failed: "FastLoginPlus: EasyAuth could not finish following your name change. Try reconnecting later; if this continues, ask an admin to check the backend logs and storage."
invalid-identity: "FastLoginPlus: the proxy identity is missing or invalid. Reconnect through the trusted proxy; if this continues, contact an admin."
bedrock-unsupported: "FastLoginPlus: Fabric mode does not support Bedrock/Floodgate connections. Please join with Minecraft Java Edition."
auth-unavailable: "FastLoginPlus: EasyAuth account verification or saving failed. Reconnect and try again; if this continues, ask an admin to check the backend logs and EasyAuth settings."
binding-login-required: "FastLoginPlus: log in to your EasyAuth password account first, then run /flp premium."
binding-identity-required: "FastLoginPlus: this connection has no usable verified or offline identity. Reconnect through the trusted proxy and retry /flp premium."
binding-password-required: "FastLoginPlus: binding requires an existing password account. If already upgraded, reconnect for passwordless login; otherwise contact an admin."
binding-save-failed: "FastLoginPlus: EasyAuth could not confirm the premium account save. The live account was restored and your password retained, but the premium request remains. Reconnect with your verified premium account after storage recovers; an admin can clear the premium request if you need the password again."
admin-premium-permission: "FastLoginPlus: enabling premium login for another player requires operator level 2."
admin-premium-no-carrier: "FastLoginPlus: no player is online to relay the request to the proxy. Retry when a player is connected."
admin-premium-already: "FastLoginPlus: {player} is already premium-bound. No request was sent."
admin-premium-open: "FastLoginPlus: premium consent requested for {player}. Their next login follows the proxy and EasyAuth registration policy. If still connected, they must reconnect; the proxy decides whether to kick them."
admin-premium-requested: "FastLoginPlus: premium consent requested for {player}. A verified premium reconnect enables passwordless login. Their password is retained but not used while premium is enabled. The proxy decides whether to kick them; otherwise they must reconnect manually."
premium-requested: "FastLoginPlus: the premium consent request was handed to the proxy for processing. If a confirmation prompt appears, run /flp premium once more. Then reconnect with your premium account to enable passwordless login. Your password is retained but not used while premium is enabled."
admin-command-permission: "FastLoginPlus: this account command requires operator level 2."
cracked-login-required: "FastLoginPlus: log in to your EasyAuth account first, then run /flp cracked."
cracked-requested: "FastLoginPlus: disabling premium login requested. Any saved password is retained; after a successful local unbind, use it to log in again. The proxy decides whether to kick you; otherwise reconnect manually. Player data is not migrated between UUIDs."
admin-cracked-requested: "FastLoginPlus: disabling premium login requested for {player}. Any saved password is retained; after a successful local unbind, they use it to log in again. The proxy decides whether to kick them; otherwise they must reconnect manually. Player data is not migrated between UUIDs."
cracked-release-confirm: "FastLoginPlus: {player} is premium-bound without a saved password. Run the same command again within 30 seconds to release the binding and allow registration again. No request was sent and the account was not changed."
cracked-release-requested: "FastLoginPlus: disabling premium login requested and the local binding released. Reconnect and use /register to set a password. The proxy decides whether to kick you; otherwise reconnect manually."
admin-cracked-release-requested: "FastLoginPlus: disabling premium login requested for {player} and the local binding released. They must reconnect and use /register to set a password. The proxy decides whether to kick them; otherwise they must reconnect manually."
cracked-release-failed: "FastLoginPlus: the proxy disable request was sent, but EasyAuth could not save the local release. Local account fields were restored and the premium binding remains locally. Ask an admin to check storage, then retry /flp cracked."
cracked-save-failed: "FastLoginPlus: the proxy disable request was sent, but EasyAuth could not save the local unbind. Local account fields were restored and the password retained. Premium binding remains locally; ask an admin to check storage, then retry /flp cracked."
delete-requested: "FastLoginPlus: proxy FLP profile deletion requested for {player}. The EasyAuth account and password are not deleted. Check the proxy console for the final result; this is not a deletion confirmation."
delete-premium-denied: "FastLoginPlus: {player} is premium-bound. Run /flp cracked first; an account without a saved password requires a second confirmation to allow registration again. The EasyAuth account is never deleted by /flp delete."
binding-saved-reconnect: "FastLoginPlus: binding was saved but this login could not finish. Reconnect with your premium account for passwordless login."
binding-consent-required: "FastLoginPlus: this name has not been switched to passwordless premium login. Log in with your existing password first, then run /flp premium to complete binding."
premium-policy-disabled: "FastLoginPlus: automatic premium login is disabled by the server policy. A retained password does not enable unverified access to a premium-bound account; contact an administrator. Other accounts keep EasyAuth's password or registration flow."
registration-required: "FastLoginPlus: automatic account creation is disabled. Register with EasyAuth first, then log in and run /flp premium to bind."
authenticated: "Authenticated with FastLoginPlus."
update-available: "FastLoginPlus: new version available: %new% (current: %current%). Download: https://github.com/Hayston1001/FastLoginPlus/releases"
same-name-cracked-recorded: "Your account has been recorded as cracked. Are you a premium player? If you were misjudged, use /flp premium to start the verification again"
