# UTF-8 player messages. Missing or blank overrides fall back to bundled values.
ownership-conflict=FastLoginPlus: this account does not match this connection's verified identity. Reconnect with the correct account or contact an admin.
invalid-identity=FastLoginPlus: the proxy identity is missing or invalid. Reconnect through the trusted proxy; if this continues, contact an admin.
auth-unavailable=FastLoginPlus: EasyAuth account verification or saving failed. Reconnect and try again; if this continues, ask an admin to check the backend logs and EasyAuth settings.
binding-login-required=FastLoginPlus: log in to your EasyAuth password account first, then run /flp premium.
binding-identity-required=FastLoginPlus: this connection has no usable verified or offline identity. Reconnect through the trusted proxy and retry /flp premium.
binding-password-required=FastLoginPlus: binding requires an existing password account. If already upgraded, reconnect for passwordless login; otherwise contact an admin.
binding-account-saving=FastLoginPlus: the password account is still saving. Nothing was changed; retry /flp premium shortly.
binding-save-failed=FastLoginPlus: EasyAuth could not confirm the binding save. The live password entry was restored; ask an admin to check storage before retrying /flp premium.
binding-account-changed=FastLoginPlus: the account changed during binding. Nothing was changed by this attempt; log in with your current password and retry /flp premium.
binding-checking=FastLoginPlus: checking this name's premium identity...
binding-name-unavailable=FastLoginPlus: this name's premium identity could not be resolved. Your password is unchanged; retry /flp premium later.
binding-queued=FastLoginPlus: premium upgrade queued for UUID {uuid}. Keep Minecraft open for the verification reconnect. Your password stays unchanged until success. If the ten-minute window expires or the backend restarts, log in with your password and run /flp premium again.
binding-complete=FastLoginPlus: binding completed for your verified premium identity. Future connections use passwordless login and the Mojang UUID; offline-UUID player data is not migrated.
binding-saved-reconnect=FastLoginPlus: binding was saved but this login could not finish. Reconnect with your premium account for passwordless login.
binding-transfer-unavailable=FastLoginPlus: the verification reconnect address is not configured correctly. Your password is unchanged; ask an admin to configure binding-transfer-host and binding-transfer-port, then retry /flp premium.
binding-window-unavailable=FastLoginPlus: the binding window has expired, was lost after a restart, or was never completed. This account still uses its password. Log in with it, then run /flp premium to bind now.
binding-consent-required=FastLoginPlus: this name has not been switched to passwordless premium login. Log in with your existing password first, then run /flp premium to complete binding.
premium-policy-disabled=FastLoginPlus: automatic premium login is disabled by the server policy. Premium-bound accounts have no usable password; contact an administrator or reset the password according to the server policy. Other accounts keep EasyAuth's password or registration flow.
registration-required=FastLoginPlus: automatic account creation is disabled. Register with EasyAuth first, then log in and run /flp premium to bind.
authenticated=Authenticated with FastLoginPlus.
same-name-cracked-recorded=Your account has been recorded as cracked. Are you a premium player? If you were misjudged, use /flp premium to start the verification again
