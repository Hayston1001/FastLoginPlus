# FastLoginPlus Fabric configuration (backend-local keys only)
#
# Effect scope (R-10): policy keys (autoRegister, autoLogin, offline-whitelist,
# premium-warning, kick-toggle, auto-register-unknown, ...) live on the proxy
# and arrive here with the identity facts. They are enforced here but NOT set
# here. This file only holds keys that are local to this backend.
#
# Configuration changes require a backend restart, except the two command-read
# transfer fields listed below. Hot reload and /flp reload are known unsupported.
# Field -> effective timing
# allowed-proxy-ids -> read once at server startup and frozen until restart
# language -> read once at server startup; en or zh, missing keys fall back to English
# binding-transfer-host -> read for each /flp premium command
# binding-transfer-port -> read for each /flp premium command
# EasyAuth policy (external, not keys in this file) -> rechecked on each
# connection and account operation using EasyAuth's current in-memory settings;
# this does not reread EasyAuth's configuration files or provide hot reload.
#
# A pending binding window is in-memory state with a ten-minute lifetime.
# Restarting the backend interrupts unfinished binding; log in and start again.
# Disconnecting does not by itself clear the binding window.

# Public address the client is transferred to for the premium verification
# reconnect after /flp premium. This is only an auto-reconnect helper: a manual
# reconnect works too, and the queued upgrade survives it.
binding-transfer-host=
binding-transfer-port=

# Comma-separated proxy UUIDs this backend trusts when it reports an upgrade
# consent to the proxy (the UUID from the proxy's proxyId.txt). The proxy
# refuses unauthenticated backend messages, so with an empty list /flp premium
# can queue an upgrade but the consent never reaches the proxy and the binding
# cannot complete. Fill this in on every backend that runs /flp premium.
# This list is frozen at startup, including the empty value; editing it requires
# a backend restart and is not applied by the command-time transfer read.
allowed-proxy-ids=

# Backend-local player messages. Optional UTF-8 overrides may be placed in
# config/fastloginplus-fabric/messages_en.properties or messages_zh.properties.
language=en
