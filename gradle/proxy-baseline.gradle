// Applied by bungee and velocity: the guava/gson/slf4j versions the supported proxies bundle
// (BungeeCord 1.20-R0.2: guava 32.1.2-jre, gson 2.10.1; Velocity 3.3.0-SNAPSHOT: guava
// 25.1-jre, gson 2.10.1, slf4j-api 2.0.12). ProxyBaselineLinkageTest resolves exactly these
// and checks our shipped classes against them, so raising one is a proxy-floor decision.
// They live here, not in the modules' build.gradle, because Dependabot only fetches
// build.gradle / settings.gradle / gradle.properties / libs.versions.toml and would propose
// raising them: see .github/dependabot.yml. Change a value together with the mirrored test
// constant.

def proxyBaselines = [
        bungee  : ['com.google.guava:guava:32.1.2-jre',
                   'com.google.code.gson:gson:2.10.1'],
        velocity: ['com.google.guava:guava:25.1-jre',
                   'com.google.code.gson:gson:2.10.1',
                   'org.slf4j:slf4j-api:2.0.12'],
]

def baseline = proxyBaselines[project.name]
if (baseline == null) {
    throw new GradleException('gradle/proxy-baseline.gradle is for bungee and velocity only, '
            + "not for '${project.name}'")
}

configurations.matching { it.name in ['testCompileClasspath', 'testRuntimeClasspath'] }.configureEach {
    resolutionStrategy.force(*baseline)
}
