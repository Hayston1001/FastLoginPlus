// Applied by core, after compileJava21 is registered.
//
// The oldest server-provided SQLite driver we promise to keep working on (bukkit/folia run the
// user's own copy): the sqliteFloorTest task below re-runs the storage tests against it, and
// PROMISED_FLOOR in SQLiteStorageTest states the same promise - the test fails when the two
// disagree. The version sits here rather than in the catalog because Dependabot rewrites the
// catalog and used to propose raising the floor to the newest driver on every run: see
// .github/dependabot.yml.

def sqliteFloorVersion = '3.36.0'

// Resolved by name: this script is applied to core, so an unqualified reference would fall
// through to the task instance, which has no map().
def compileJava21 = tasks.named('compileJava21', JavaCompile)

configurations { sqliteFloor }

dependencies {
    sqliteFloor "org.xerial:sqlite-jdbc:${sqliteFloorVersion}"
}

tasks.register('sqliteFloorTest', Test) {
    description = 'Run storage tests against the oldest supported server SQLite driver.'
    group = 'verification'
    dependsOn tasks.named('testClasses'), compileJava21
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = files(compileJava21.map { it.destinationDirectory }) +
        sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('sqlite-jdbc-') } +
        configurations.sqliteFloor
    useJUnitPlatform()
    include '**/SQLiteStorageTest.class', '**/SQLStorageUpsertLockTest.class'
    systemProperty 'expected.sqlite.driver.version', sqliteFloorVersion
    shouldRunAfter tasks.named('test')
}
tasks.named('check') { dependsOn tasks.named('sqliteFloorTest') }
