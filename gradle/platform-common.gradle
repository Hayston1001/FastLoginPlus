apply from: rootProject.file('gradle/bedrock.gradle')

dependencies {
    compileOnly("com.mojang:datafixerupper:${rootProject.versions.datafixerupper}") { transitive = false }
    compileOnly("com.comphenix.protocol:ProtocolLib:${rootProject.versions.protocolLib}") { transitive = false }
    compileOnly("com.github.ProtocolSupport:ProtocolSupport:${rootProject.versions.protocolSupport}") { transitive = false }
    compileOnly "io.netty:netty-handler:${rootProject.versions.netty}"
    compileOnly("me.clip:placeholderapi:${rootProject.versions.placeholderApi}") { transitive = false }
    compileOnly("fr.xephi:authme:${rootProject.versions.authme}") { transitive = false }
    compileOnly("com.lenis0012.bukkit:loginsecurity:${rootProject.versions.loginSecurity}") { transitive = false }
    compileOnly("com.github.games647:LogIt:${rootProject.versions.logit}") { transitive = false }
    compileOnly("de.luricos.bukkit:xAuth:${rootProject.versions.xauth}") { transitive = false }
    compileOnly("com.github.zigazajc007:Passky:${rootProject.versions.passky}") { transitive = false }
    compileOnly("net.skinsrestorer:skinsrestorer-api:${rootProject.versions.skinsRestorer}") { transitive = false }
    compileOnly files('lib/CrazyCore v10.7.7.jar', 'lib/CrazyLogin v7.23.2.jar',
        'lib/UltraAuth v2.1.2.jar')
    testImplementation 'org.bouncycastle:bcprov-jdk18on:1.86'
}

configurations.testImplementation.extendsFrom(configurations.compileOnly)

tasks.named('shadowJar') {
    // Shadow rewrites multi-release entry paths during relocation. Preserve
    // core's Java 21 scheduler and the relocated SnakeYAML Java 9 branch.
    filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    relocate 'org.yaml.snakeyaml', 'fastlogin.yaml'
    relocate 'com.zaxxer.hikari', 'fastlogin.hikari'
    relocate 'org.slf4j', 'fastlogin.slf4j'
    relocate 'net.md_5.bungee.config', 'fastlogin.config'
    relocate 'com.google.gson', 'fastlogin.gson'
    relocate('com.google.common', 'fastlogin.guava') {
        exclude 'com.google.common.collect.Multimap'
    }
    mergeServiceFiles()
    minimize {
        // Gson adapters and Guava helpers are created reflectively. Shadow's
        // reachability analysis otherwise drops classes Maven Shade retained.
        exclude(dependency('com.google.code.gson:gson:.*'))
        exclude(dependency('com.google.guava:guava:.*'))
        exclude(dependency('org.slf4j:.*:.*'))
        exclude(dependency('org.yaml:snakeyaml:.*'))
    }
    exclude '**/module-info.class'
}
