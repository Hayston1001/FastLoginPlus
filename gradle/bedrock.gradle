// These APIs are supplied by the server or another plugin. Keep their
// transitive implementation trees off the compile and packaged classpaths.
dependencies {
    compileOnly(libs.floodgate.api) { transitive = false }
    compileOnly(libs.geyser.core) { transitive = false }
    compileOnly(libs.geyser.api) { transitive = false }
    compileOnly libs.geyser.base.api
    compileOnly(libs.geyser.common) {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    compileOnly libs.fastutil.core
    compileOnly(libs.cumulus) {
        exclude group: 'com.google.code.gson', module: 'gson'
    }
}
