pluginManagement {
    repositories {
        maven { url = uri('https://maven.fabricmc.net/') }
        gradlePluginPortal()
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.fabricmc.fabric-loom') {
                useModule("net.fabricmc:fabric-loom:${requested.version}")
            }
        }
    }
}

// build.gradle pins the JDK 21 toolchain (JavaLanguageVersion.of(21)). Declaring a
// toolchain download repository is what makes that a supported configuration: without one
// Gradle can only use JDKs it finds on the machine, and falling back to a JDK it
// provisioned itself is deprecated (Gradle 10 turns it into an error). With the Foojay
// resolver a machine with no JDK 21 - a fresh contributor box, a container - downloads one
// instead of failing with "No matching toolchains found". An installed JDK 21 is still
// preferred, so CI and developer machines with one never touch the network for this.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Loom adds a project-level repository for its remapped Minecraft artifacts,
// so the build uses PREFER_PROJECT. The single repository list lives in
// gradle/repositories.gradle and is applied to every project by the root build.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
}

rootProject.name = 'FastLoginPlus'
include 'protocol', 'shared', 'craftapi', 'core', 'bukkit', 'folia', 'bungee', 'velocity'

// Fabric 26.2 and Loom require the JVM running Gradle to be Java 25. The classic
// modules keep their Java 21 toolchain.
if (!JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
    throw new GradleException('The Fabric 26.2 build requires Gradle to run on Java 25')
}
include 'fabric26_2'
project(':fabric26_2').projectDir = file('fabric/mc26_2')
