<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastLoginPlus — 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body class="page-login">
    <div class="portal-glow"></div>
    <div class="login-container">
        <div class="login-icon">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <rect x="8" y="8" width="32" height="32" rx="4" stroke="currentColor" stroke-width="2.5"/>
                <rect x="16" y="16" width="16" height="16" rx="2" fill="currentColor" opacity="0.3"/>
                <rect x="20" y="20" width="8" height="8" rx="1" fill="currentColor"/>
            </svg>
        </div>
        <h1>FastLoginPlus</h1>
        <p class="login-subtitle">输入令牌以连接到服务器面板</p>
        <div class="input-group">
            <input type="password" id="token-input" name="token" autocomplete="current-password" placeholder="访问令牌" autofocus>
        </div>
        <button id="login-btn">连接</button>
        <div id="login-error" class="error" role="alert"></div>
        <p class="login-hint">输入 <code>demo</code> 可预览界面</p>
    </div>
    <script src="login.js?v=3"></script>
</body>
</html>
