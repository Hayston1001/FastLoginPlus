plugins { id 'com.gradleup.shadow' }
// Lowest JRE that can load this artifact - keep in sync with the module table in CONTRIBUTING.md.
ext.javaFloor = 17
apply from: rootProject.file('gradle/bedrock.gradle')

dependencies {
    implementation project(':shared')
    implementation(project(':core')) {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'org.slf4j'
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    compileOnly(libs.velocity.api) {
        exclude group: 'com.moandjiezana.toml'
        exclude group: 'org.spongepowered'
    }
    implementation(libs.mariadb) {
        exclude group: 'com.github.waffle', module: 'waffle-jna'
    }
    implementation libs.sqlite.driver
}
configurations.testImplementation.extendsFrom(configurations.compileOnly)
// Proxy-bundled baseline versions for the test classpath: see gradle/proxy-baseline.gradle.
apply from: rootProject.file('gradle/proxy-baseline.gradle')

def generateBuildInfo = tasks.register('generateBuildInfo', Copy) {
    from 'src/main/java-templates'
    into layout.buildDirectory.dir('generated/sources/buildInfo/java')
    def values = [
        displayName: 'FastLoginPlusVelocity',
        pluginId: 'fastloginplus',
        projectVersion: project.version.toString(),
        description: 'Actively maintained fork of FastLogin with updates and feature enhancements',
        projectUrl: 'https://github.com/Hayston1001/FastLoginPlus'
    ]
    inputs.properties(values)
    filesMatching('**/BuildInfo.java') {
        expand(values)
    }
}
sourceSets.main.java.srcDir(layout.buildDirectory.dir('generated/sources/buildInfo/java'))
tasks.named('compileJava') { dependsOn generateBuildInfo }

tasks.named('shadowJar') {
    filesMatching('META-INF/services/**') { duplicatesStrategy = DuplicatesStrategy.INCLUDE }
    relocate 'com.zaxxer.hikari', 'fastlogin.hikari'
    relocate 'net.md_5.bungee.config', 'fastlogin.config'
    relocate 'org.mariadb', 'fastlogin.mariadb'
    relocate 'org.yaml.snakeyaml', 'fastlogin.yaml'
    mergeServiceFiles()
    minimize {
        // Both JDBC drivers are bundled as-is, like the Maven build did: it exempted them
        // from minimization with <includes>**</includes> filters. Everything else (HikariCP,
        // SnakeYAML, our own classes) is minimized as before.
        exclude(dependency('org.xerial:sqlite-jdbc:.*'))
        exclude(dependency('org.mariadb.jdbc:mariadb-java-client:.*'))
    }
}
