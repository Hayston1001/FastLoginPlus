plugins { id 'com.gradleup.shadow' }
apply from: rootProject.file('gradle/platform-common.gradle')

dependencies {
    implementation project(':core')
    compileOnly(libs.paper.api) {
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'com.google.guava'
        exclude group: 'com.google.code.gson'
        exclude group: 'io.netty'
    }
}

// Keep the server API baseline versions used for this jar; the vendored
// CraftAPI module resolves newer versions for its own tests.
configurations.matching {
    it.name in ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath']
}.configureEach {
    resolutionStrategy.force 'com.google.code.gson:gson:2.10.1', 'com.google.guava:guava:32.1.2-jre'
}

tasks.named('shadowJar') {
    relocate 'io.papermc.lib', 'fastlogin.paperlib'
}
