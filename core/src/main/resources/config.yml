# ========================================
# FastLoginPlus Configuration (Bukkit / Folia)
# ========================================
# This template ships with the Bukkit/Folia plugin and covers BOTH deployment
# modes:
#   standalone    - no proxy, direct connections
#   proxy backend - behind a Bungee or Velocity server
#
# A key that behaves differently in the two modes says so in its own comment, with a
# "Behind a proxy:" line. It describes what THIS server does when it IS a proxy
# backend.
#
# Three shapes appear:
#   ignored here        - this server never reads the key. The proxy decides, from
#                         its own copy of the key in the proxy's config.yml - that
#                         is the one to edit.
#   standalone only     - this server never reads the key, and the proxy has no such
#                         key either: it exists only in standalone deployments.
#   only Paper reads it - still read here, but only in Paper's connection
#                         configuration phase; on Spigot this degenerates to
#                         "ignored here", above.
#                         (The configuration-phase connection event FLP uses exists
#                          from 1.21.7 onwards; AuthMe 6.0's pre-join dialogs require
#                          Paper/Folia 1.21.11+, so on any server where this matters
#                          the event is always present.)
#
# Keys without a "Behind a proxy:" line behave identically in both modes.
#
# Examples — how to read a "Behind a proxy:" line:
#
#   --------------------------------
#   # Behind a proxy: ignored here - the proxy runs its own anti-bot checks
#   anti-bot:
#     enabled: true
#   --------------------------------
#   Standalone: This section fully works HERE.
#   Behind a proxy: Editing this section HERE changes NOTHING. You should edit this in proxy's config.yml
#
#   --------------------------------
#   # Behind a proxy: only Paper reads it, in the configure phase
#   ip-addresses:
#   --------------------------------
#   Standalone: This section fully works HERE.
#   Behind a proxy: Only Paper's configure phase reads it (for the pre-login Mojang
#   lookup); on Spigot editing this section HERE changes NOTHING.
#
#   --------------------------------
#   language: en
#   --------------------------------
#   No "Behind a proxy:" line: behaves identically in both modes.

# ========================================
# Language
# ========================================
# Language file to use. Built-in options: "en"(English), "zh"(中文)
# You can also use a custom value, e.g. "ja" -> loads messages_ja.yml
# Missing keys will be auto-filled on startup.
language: en

# ========================================
# Update Check
# ========================================
# Check for new versions on GitHub. Logs to console; notifies OPs on login
check-update: true
# Check interval in hours
update-check-interval: 24

# ========================================
# Anti-bot
# ========================================
# Simple anti-bot protection. For serious protection, use a dedicated firewall
# Behind a proxy: ignored here - the proxy runs its own anti-bot checks
anti-bot:
  enabled: true
  # Total connections allowed in the time window
  connections: 600
  # Minutes before entries expire
  expire: 10
  # Action when limit is hit: 'ignore' (FastLogin stops handling the connection —
  # login continues as a normal cracked login, no Mojang/DB requests) or 'block'
  # (reject the connection with the kick-antibot message)
  action: 'ignore'

  # --- Per-IP rate limiting ---
  # Max connections per IP in the long window
  per-ip-connections: 20
  # Long window duration (minutes)
  per-ip-expire: 5

  # --- Burst detection ---
  # Max connections per IP in the burst window
  burst-limit: 10
  # Burst window duration (seconds)
  burst-window: 10

  # --- Temporary ban ---
  # Ban duration when per-IP limit is exceeded (minutes) 
  ban-duration: 5

  # --- Trusted IPs ---
  # IPs that bypass all anti-bot checks
  # trusted-ips:
  #   - '127.0.0.1'
  trusted-ips:

# ========================================
# Premium Detection
# ========================================
# Auto-register new premium players on first join
# Behind a proxy: ignored here - the proxy controls the new-premium-player
# route. Name-change checks and offline-whitelist can also request premium
# verification. Account creation here still depends on declared login policies
# and account ownership; this copy only applies in standalone mode
autoRegister: true

# Enable auto-login for premium players
# Behind a proxy: ignored here - the proxy's value travels with the identity
# facts and is enforced here; this copy only applies in standalone mode
autoLogin: true

# Proxy backends only: require declared policy facts before accepting a force
# LOGIN/REGISTER plugin message. Default false preserves older proxy compatibility.
# Enabling this rejects force requests from proxies without policy facts: their
# players keep the auth plugin's own password/registration flow and may lose
# passwordless access. Upgrade proxies before enabling. This does not authenticate
# messages or replace the proxy allowlist. Explicit autoLogin:false facts always
# override a contradictory force intent, regardless of this switch.
require-declared-proxy-policy: false

# Whether to use the premium UUID after premium verification (does not decide
# whether premium verification is enabled).
# In standalone mode, true = inject the premium UUID into the offline-mode
# server (ProtocolLib reflection)
# Behind a proxy: ignored here - the proxy decides the UUID
premiumUuid: true

# Query Mojang API for new players and detect name changes by UUID
# If a player's name is not in the database but their UUID is (under an old name),
# the old record is updated with the new name and they log in as premium
# Behind a proxy: ignored here - the proxy detects name changes
nameChangeCheck: true

# If an offline player uses a premium username but fails authentication, 
# remember them so they can join in offline mode next time (not recommended)
# Behind a proxy: ignored here - the cracked fallback runs on the proxy
secondAttemptCracked: false

# ========================================
# Offline Whitelist
# ========================================
# When enabled, offline players not present in the database will be denied entry (custom kick message available)
# Offline players already in the database may still join
# No restrictions apply to online players
# Use /flp cracked <player> to add offline players to the database
# Use /flp delete <player> to remove offline players from the database
# Behind a proxy: ignored here - the proxy enforces the whitelist
offline-whitelist: false

# ========================================
# Skin
# ========================================
# Forward premium skin to the player
# Even when enabled, SkinsRestorer custom skins take priority (if SR is installed)
# Behind a proxy: ignored here - the proxy forwards or strips the skin itself
forwardSkin: true

# ========================================
# Command Behavior
# ========================================
# Show warning before /flp premium command takes effect
# Behind a proxy: ignored here - the proxy asks for the confirmation
premium-warning: true

# Kick the player from the server after they confirm /flp premium, forcing them to reconnect
# Behind a proxy: the proxy's copy decides the kick after a toggle; this copy
# additionally kicks after relaying a queued toggle and only applies fully in
# standalone mode
# Reconnection is manual; this does not automatically reconnect the player.
kick-toggle: true

# ========================================
# Advanced
# ========================================
# Enable verbose logging for troubleshooting.
debug: false

# Auto-register a verified premium player who is missing from the auth plugin DB
# (the account was deleted, or the two databases drifted apart).
# Scope - the key name misleads: "unknown" does NOT mean strangers or offline
# players. This only applies to a connection Mojang has verified whose name has
# no local account: the account is then registered for that proven identity, and
# the generated password is only a backup - premium logins never need one.
# Offline/cracked connections are never covered: they carry no identity proof at
# all (the name is just a string), so they get the register dialog and set their
# own password - an account can only change hands through a password its owner
# chose. Off = a verified premium player without a local account gets the
# register dialog instead of an automatic account.
# Behind a proxy: ignored here - the proxy's value travels with the identity
# facts and is enforced here; this copy only applies in standalone mode
auto-register-unknown: true

# Respect auth plugin per-IP registration limit
# Bukkit/Folia only - currently honored by the AuthMe hook; other auth-plugin
# hooks do not implement this check yet. Works in both modes (the auth plugin
# runs on this server).
respectIpLimit: false

# Alternative session resolver that doesn't send the server IP to Mojang
# Useful behind DNAT / transparent reverse proxies
# In standalone mode it omits the ip parameter in hasJoined, so verification
# matches even when the backend observes a different IP than the client used
# Behind a proxy: standalone only - hasJoined never runs here; the proxy has no such key
useProxyAgnosticResolver: true

# Mojang API retry
# Retry count for Mojang API calls (Name→UUID lookup + session verification)
# Total attempts per request
# Behind a proxy: ignored here - no retried Mojang call is made by this server
mojang-retry-count: 3
# Base delay between retries in milliseconds (exponential backoff: delay * 2^(attempt-1), capped at 10s)
# Behind a proxy: ignored here - no retried Mojang call is made by this server
mojang-retry-delay: 500

# Verify client public key signature (1.19+, standalone ProtocolLib)
# Behind a proxy: standalone only - ProtocolLib never runs here; the proxy has no such key
verifyClientKeys: false

# IP addresses for rotating Mojang API requests (to avoid rate limits)
# Behind a proxy: only Paper reads it, in the configure phase
# ip-addresses:
#   - 192-168-0-2
ip-addresses:

# Max Mojang name->UUID requests per 10 minutes
# Behind a proxy: only Paper reads it, in the configure phase
# Mojang allows 600 requests per 10 minutes per outgoing IPv4 address. Lower this to
# leave room for other plugins, or raise it while using 'proxies' below. Valid range
# 0..600, other values are clamped. 0 means "never call Mojang directly" and requires
# at least one proxy entry; without one the value is reset to 600.
mojang-request-limit: 600

# ========================================
# Floodgate / Bedrock
# ========================================
# Auto-login for Floodgate (Bedrock) players. Values: false / true / linked / no-conflict
# Behind a proxy: ignored here - the proxy handles Bedrock players
autoLoginFloodgate: false

# Allow Bedrock players to join even if their name conflicts with a Java premium account
# Behind a proxy: ignored here - the proxy enforces the conflict policy
allowFloodgateNameConflict: false

# Auto-register Floodgate players. Requires autoLoginFloodgate
# Behind a proxy: ignored here - the proxy handles Bedrock players
autoRegisterFloodgate: false

# ========================================
# Database
# ========================================
# Behind a proxy: ignored here - this server never opens a database; the proxy's
#                                DB is the single source of truth
# Database driver: 'sqlite' (default) or 'mysql'
driver: 'sqlite'

# Database name or file path
# For SQLite: file path (e.g. database: '{pluginDir}/FastLogin.db')
# For MySQL: database name (e.g. database: 'fastloginplus')
database: '{pluginDir}/FastLogin.db'

# MySQL connection settings (only used when driver: 'mysql')
host: '127.0.0.1'
port: 3306
username: 'myUser'
password: 'myPassword'

# --- Connection pool settings (seconds) ---
# timeout: how long an operation waits to obtain a connection from the pool
# before failing (HikariCP connectionTimeout)
timeout: 30
# lifetime: how long a pooled connection lives before the pool retires and
# replaces it (HikariCP maxLifetime).
# Recommended: 1800 (30 minutes — the HikariCP default): long enough to
# amortize TCP/auth/TLS handshake costs, short enough to retire connections
# before the server kills them — keep it BELOW your MySQL wait_timeout
# (default 8h). Values below 300 are clamped to 300 with a startup warning
# (shorter lifetimes make the pool constantly reconnect); 0 = never expire.
lifetime: 1800

# SSL for MySQL (only used when driver: 'mysql')
useSSL: false
sslMode: Required
allowPublicKeyRetrieval: false
# Local path to MySQL server's RSA public key file (alternative to allowPublicKeyRetrieval)
# Only needed if allowPublicKeyRetrieval is false and server uses caching_sha2_password
ServerRSAPublicKeyFile:

# ========================================
# Proxies
# ========================================
# HTTP proxies for Mojang API requests (workaround for rate limits)
# Behind a proxy: only Paper reads it, in the configure phase
# proxies:
#   - 'xyz.com:1337'
proxies:
