# Project: https://github.com/Hayston1001/FastLoginPlus

# ========================================
# FastLoginPlus Configuration (BungeeCord / Velocity proxy)
# ========================================
# This template ships with the BungeeCord/Velocity plugin. The proxy is the
# decision maker in proxy deployments: it runs all Mojang API queries, owns
# the database, and forwards force-login commands to the backends.
# Backend-only keys (verifyClientKeys, respectIpLimit) and behaviorally inert
# keys (useProxyAgnosticResolver) are NOT present here.

# ========================================
# Language
# ========================================
# Language file to use. Built-in options: "en"(English), "zh"(中文)
# You can also use a custom value, e.g. "ja" -> loads messages_ja.yml
# Missing keys will be auto-filled on startup.
language: en

# ========================================
# Update Check
# ========================================
# Check for new versions on GitHub. Logs to console
check-update: true
# Check interval in hours
update-check-interval: 24

# ========================================
# Anti-bot
# ========================================
# Simple anti-bot protection. For serious protection, use a dedicated firewall
# Enforced here by the proxy's connection listener.
anti-bot:
  enabled: true
  # Total connections allowed in the time window
  connections: 600
  # Minutes before entries expire
  expire: 10
  # Action when limit is hit: 'ignore' (FastLogin stops handling the connection —
  # login continues as a normal cracked login, no Mojang/DB requests) or 'block'
  # (reject the connection with the kick-antibot message)
  action: 'ignore'

  # --- Per-IP rate limiting ---
  # Max connections per IP in the long window
  per-ip-connections: 20
  # Long window duration (minutes)
  per-ip-expire: 5

  # --- Burst detection ---
  # Max connections per IP in the burst window
  burst-limit: 10
  # Burst window duration (seconds)
  burst-window: 10

  # --- Temporary ban ---
  # Ban duration when per-IP limit is exceeded (minutes) 
  ban-duration: 5

  # --- Trusted IPs ---
  # IPs that bypass all anti-bot checks
  # trusted-ips:
  #   - '127.0.0.1'
  trusted-ips:

# ========================================
# Premium Detection
# ========================================
# Auto-register new premium players on first join
# Runs on the proxy: Mojang lookup, DB write and online-mode toggle happen
# here; the backend only executes forceLogin/forceRegister through its auth
# plugin.
autoRegister: true

# Enable auto-login for premium players
# The proxy decides and forwards the force-login command to the backend,
# which executes it through the auth plugin.
autoLogin: true

# Use premium UUID for premium players
# The native proxy API handles the premium UUID. false = override the premium
# UUID with the offline UUID (demote).
premiumUuid: true

# Query Mojang API for new players and detect name changes by UUID
# If a player's name is not in the database but their UUID is (under an old name),
# the old record is updated with the new name and they log in as premium
nameChangeCheck: true

# If an offline player uses a premium username but fails authentication, 
# remember them so they can join in offline mode next time (not recommended)
secondAttemptCracked: false

# ========================================
# Offline Whitelist
# ========================================
# When enabled, offline players not present in the database will be denied entry (custom kick message available)
# Offline players already in the database may still join
# No restrictions apply to online players
# Use /flp cracked <player> to add offline players to the database
# Use /flp delete <player> to remove offline players from the database
# Enforced by the proxy.
offline-whitelist: false

# ========================================
# Skin
# ========================================
# Forward premium skin to the player
# Even when enabled, SkinsRestorer custom skins take priority (if SR is installed)
# false strips the skin from the game profile before forwarding to the backend.
forwardSkin: true
# ========================================
# Plugin Message Security
# ========================================
# Authenticate backend -> proxy plugin messages (premium toggle, delete, success
# ack). Backends stamp these messages with their proxy allowlist and the proxy
# only accepts them when its own ID is part of the echoed set. Set this to
# false ONLY temporarily while performing a rolling upgrade of an older backend
# that does not yet stamp its messages.
verify-backend-messages: true

# ========================================
# Command Behavior
# ========================================
# Show warning before /flp premium command takes effect
# The proxy asks for confirmation when a backend forwards the toggle.
premium-warning: true

# Kick the player from the server after they confirm /flp premium, forcing them to reconnect
# The proxy kicks the player after a toggle.
kick-toggle: true

# ========================================
# Advanced
# ========================================
# Enable verbose logging for troubleshooting.
debug: false

# Auto-register players in flp DB but missing from auth plugin DB
# Decided by the proxy; the backend executes the registration through the
# auth plugin.
auto-register-unknown: true

# ======[[ Mojang API retry ]]======
# Retry count for Name→UUID lookups (findProfile). Session verification is the
# proxy's native online-mode login and is NOT covered by this retry.
# Total attempts per request
mojang-retry-count: 3
# Base delay between retries in milliseconds (exponential backoff: delay * 2^(attempt-1), capped at 10s)
mojang-retry-delay: 500

# IP addresses for rotating Mojang API requests (to avoid rate limits)
# ip-addresses:
#   - 192-168-0-2
ip-addresses:

# Max Mojang name->UUID requests per 10 minutes (per IP)
# NOTE: currently not applied by the bundled craftapi library (hardcoded
# 600/10min); kept for future compatibility
mojang-request-limit: 600

# ========================================
# Floodgate / Bedrock
# ========================================
# Auto-login for Floodgate (Bedrock) players. Values: false / true / linked / no-conflict
# The proxy handles Bedrock players.
autoLoginFloodgate: false

# Allow Bedrock players to join even if their name conflicts with a Java premium account
# Enforced by the proxy.
allowFloodgateNameConflict: false

# Auto-register Floodgate players. Requires autoLoginFloodgate
# The proxy handles Bedrock players.
autoRegisterFloodgate: false

# ========================================
# Database
# ========================================
# The proxy database is the single source of truth for premium status in
# proxy deployments. Backends never use their own copy.
# Database driver: 'sqlite' (default) or 'mysql'
driver: 'sqlite'

# Database name or file path
# For SQLite: file path (e.g. database: '{pluginDir}/FastLogin.db')
# For MySQL: database name (e.g. database: 'fastloginplus')
database: '{pluginDir}/FastLogin.db'

# MySQL connection settings (only used when driver: 'mysql')
host: '127.0.0.1'
port: 3306
username: 'myUser'
password: 'myPassword'

# --- Connection pool settings (seconds) ---
# timeout: how long an operation waits to obtain a connection from the pool
# before failing (HikariCP connectionTimeout)
timeout: 30
# lifetime: how long a pooled connection lives before the pool retires and
# replaces it (HikariCP maxLifetime).
# Recommended: 1800 (30 minutes — the HikariCP default): long enough to
# amortize TCP/auth/TLS handshake costs, short enough to retire connections
# before the server kills them — keep it BELOW your MySQL wait_timeout
# (default 8h). Values below 300 are clamped to 300 with a startup warning
# (shorter lifetimes make the pool constantly reconnect); 0 = never expire.
lifetime: 1800

# SSL for MySQL (only used when driver: 'mysql')
useSSL: false
sslMode: Required
allowPublicKeyRetrieval: false
# Local path to MySQL server's RSA public key file (alternative to allowPublicKeyRetrieval)
# Only needed if allowPublicKeyRetrieval is false and server uses caching_sha2_password
ServerRSAPublicKeyFile:

# ========================================
# Proxies
# ========================================
# HTTP proxies for Mojang API requests (workaround for rate limits)
# proxies:
#   - 'xyz.com:1337'
proxies:

# ========================================
# Web Management Panel
# ========================================
# Embedded web UI for managing players and viewing anti-bot stats.
# On a proxy setup (BungeeCord/Velocity) enable it here on the proxy only,
# NOT on the backend Bukkit/Folia servers.
#
# SECURITY MODEL (0.6.0/F018): the token IS the full admin access to this
# panel. It is stored in the browser's localStorage, so any code able to run
# scripts on the panel page can take it (i.e. XSS on the panel origin means
# panel compromise). The panel is designed for a single admin, bound to
# localhost/LAN or a trusted reverse proxy. Rotate the token if it may have
# leaked: stop the server, clear web.token, start again (a fresh token is
# generated and written to this file).
web:
  enabled: false
  # Host to bind to
  #   '' (empty)  - all interfaces, IPv4 + IPv6
  #   '0.0.0.0'   - all interfaces, IPv4 only
  #   '::'        - all interfaces, IPv4 + IPv6
  #   '127.0.0.1' - local access only (default - the panel is a single-admin
  #                 tool; only widen the binding deliberately)
  host: '127.0.0.1'
  # Port to listen on
  port: 8080
  # Authentication token (min 16 characters, auto-generated on first start if empty)
  # Access the panel at http://host:port and enter this token
  token: ''
  # Language for the web panel. Built-in: "en" (English), "zh" (中文)
  # You can also use a custom value, e.g. "ja" -> loads webui_ja.json from plugin folder
  # Users can also switch language in the panel (stored in browser localStorage)
  lang: 'en'

  # CORS: browser origins (besides the panel's own origin) that may call the
  # panel API cross-origin. The panel is a same-origin single-admin UI, so
  # this stays empty unless you deliberately host the panel behind another
  # origin. Example: corsAllowedOrigins: ['http://panel.example.com']
  corsAllowedOrigins: []
