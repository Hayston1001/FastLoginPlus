# ========================================
# FastLoginPlus Configuration (BungeeCord / Velocity proxy)
# ========================================
# The proxy verifies identities, manages network policy and owns the FLP list.
# Backends check their local auth accounts and execute login or registration.
# [Proxy] Settings in this file apply on the proxy.
# [Proxy policy -> backend] The proxy sends the policy to backends, which apply
# it when deciding local account actions.
# Backend-local settings belong in the backend's config.yml or, for Fabric,
# config/fastloginplus-fabric.yml.

# ========================================
# Language
# ========================================
# Language file to use. Built-in options: "en"(English), "zh"(中文)
# You can also use a custom value, e.g. "ja" -> loads messages_ja.yml
# Missing keys will be auto-filled on startup.
language: en

# ========================================
# Update Check
# ========================================
# Check for new versions on GitHub. Logs to console
check-update: true
# Check interval in hours
update-check-interval: 24

# ========================================
# Anti-bot
# ========================================
# Simple anti-bot protection. For serious protection, use a dedicated firewall
# Limit hits always reject the connection with the kick-antibot message.
# Enforced here by the proxy's connection listener.
anti-bot:
  enabled: true
  # Total connections allowed in the time window
  connections: 600
  # Minutes before entries expire
  expire: 10

  # --- Per-IP rate limiting ---
  # Max connections per IP in the long window
  per-ip-connections: 20
  # Long window duration (minutes)
  per-ip-expire: 5

  # --- Burst detection ---
  # Max connections per IP in the burst window
  burst-limit: 10
  # Burst window duration (seconds)
  burst-window: 10

  # --- Temporary ban ---
  # Ban duration when per-IP limit is exceeded (minutes) 
  ban-duration: 5

  # --- Trusted IPs ---
  # IPs that bypass all anti-bot checks
  # trusted-ips:
  #   - '127.0.0.1'
  trusted-ips:

# ========================================
# Premium Detection
# ========================================
# Route new premium names to verification. Account creation still depends on
# backend policy and account ownership; other checks may also verify.
autoRegister: true

# [Proxy policy -> backend]
# Allow auto-login for verified premium players. This policy is sent to backends,
# which check their local accounts and enforce it.
autoLogin: true

# Use the verified premium UUID instead of the offline UUID. This does not
# enable verification or migrate player data. FLP sets AuthMeBungee/AuthMe
# Velocity's premium.keepOfflineUuidCompatibility to false when present.
premiumUuid: true

# Look up new names and reconcile proxy FLP records by UUID after a name change.
# This does not migrate backend accounts or player data.
nameChangeCheck: true

# Remember eligible failed premium verification attempts for an offline retry
# (not recommended). Confirmed premium accounts are not downgraded.
secondAttemptCracked: false

# ========================================
# Offline Whitelist
# ========================================
# Deny offline Java names unknown to the proxy's FLP list. This controls
# admission, not password or premium authentication. Manage the list with
# /flp cracked and /flp delete on a backend.
offline-whitelist: false

# ========================================
# Skin
# ========================================
# Forward premium skin to the player
# Even when enabled, SkinsRestorer custom skins take priority (if SR is installed)
# false strips the skin from the game profile before forwarding to the backend.
forwardSkin: true
# ========================================
# Plugin Message Security
# ========================================
# Authenticate backend -> proxy plugin messages (premium toggle, delete, success
# ack). Backends stamp these messages with their proxy allowlist and the proxy
# only accepts them when its own ID is part of the echoed set. Set this to
# false ONLY temporarily while performing a rolling upgrade of an older backend
# that does not yet stamp its messages.
verify-backend-messages: true

# ========================================
# Command Behavior
# ========================================
# Ask for confirmation for self-invoked premium toggles from classic backends.
# Fabric binding consent uses its own flow and does not use this warning.
premium-warning: true

# After a toggle, kick the player if true; otherwise keep the session.
# Reconnection is manual. Classic backends also have a queued-toggle setting.
kick-toggle: true

# ========================================
# Advanced
# ========================================
# Enable verbose logging for troubleshooting.
debug: false

# [Proxy policy -> backend]
# Allow backends to automatically create a missing auth-plugin account for a
# verified premium player. If false, they use normal registration. This policy
# does not create accounts for unverified offline players.
auto-register-unknown: true

# ======[[ Mojang API retry ]]======
# Total attempts for Mojang name-to-UUID lookups. The proxy's native session
# verification does not use this retry setting.
mojang-retry-count: 3
# Base delay between retries in milliseconds (exponential backoff: delay * 2^(attempt-1), capped at 10s)
mojang-retry-delay: 500

# IP addresses for rotating Mojang API requests (to avoid rate limits)
# ip-addresses:
#   - 192-168-0-2
ip-addresses:

# Max Mojang name->UUID requests per 10 minutes
# Range: 0..600 per outgoing IP. Values are clamped; 0 disables direct requests
# and requires at least one HTTP proxy below, otherwise the limit resets to 600.
mojang-request-limit: 600

# ========================================
# Floodgate / Bedrock
# ========================================
# Fabric only supports auto-login for qualifying unlinked Floodgate players
# with existing EasyAuth accounts. Auto-registration and linked login are not
# supported on Fabric, regardless of these proxy settings.
# Auto-login for Floodgate (Bedrock) players. Values: false / true / linked / no-conflict
# The proxy handles Bedrock players.
autoLoginFloodgate: false

# Allow Bedrock players to join even if their name conflicts with a Java premium account
# Enforced by the proxy.
allowFloodgateNameConflict: false

# Auto-register Floodgate players. Requires autoLoginFloodgate
# The proxy handles Bedrock players.
autoRegisterFloodgate: false

# ========================================
# Database
# ========================================
# The proxy database is the single source of truth for premium status in
# proxy deployments. Backends never use their own copy.
# Database driver: 'sqlite' (default) or 'mysql'
driver: 'sqlite'

# Database name or file path
# For SQLite: file path (e.g. database: '{pluginDir}/FastLogin.db')
# For MySQL: database name (e.g. database: 'fastloginplus')
database: '{pluginDir}/FastLogin.db'

# MySQL connection settings (only used when driver: 'mysql')
host: '127.0.0.1'
port: 3306
username: 'myUser'
password: 'myPassword'

# --- Connection pool settings (seconds) ---
# timeout: how long an operation waits to obtain a connection from the pool
# before failing (HikariCP connectionTimeout)
timeout: 30
# lifetime: connection lifetime in seconds. Keep it below MySQL wait_timeout.
# Values below 300 are clamped to 300; 0 disables expiry.
lifetime: 1800

# SSL for MySQL (only used when driver: 'mysql')
useSSL: false
sslMode: Required
allowPublicKeyRetrieval: false
# Local path to MySQL server's RSA public key file (alternative to allowPublicKeyRetrieval)
# Only needed if allowPublicKeyRetrieval is false and server uses caching_sha2_password
ServerRSAPublicKeyFile:

# ========================================
# Proxies
# ========================================
# HTTP proxies for Mojang API requests (workaround for rate limits)
# proxies:
#   - 'xyz.com:1337'
proxies:
