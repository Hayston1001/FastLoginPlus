// Lowest JRE that can load this artifact - keep in sync with the module table in
// CONTRIBUTING.md. The Java 21 scheduler in src/main/java21 is a multi-release branch
// and does not change the floor.
ext.javaFloor = 8

apply from: rootProject.file('gradle/bedrock.gradle')

dependencies {
    api project(':shared')
    api project(':protocol')
    api project(':craftapi')
    api(libs.hikari) { exclude group: 'org.slf4j', module: 'slf4j-api' }
    api libs.slf4j.jdk14
    api libs.bungeecord.config
    api libs.snakeyaml
    compileOnly libs.sqlite.driver
    testImplementation libs.sqlite.driver
}

tasks.named('jar') {
    manifest.attributes('Automatic-Module-Name': 'com.github.games647.fastlogin.core')
}

def compileJava21 = tasks.register('compileJava21', JavaCompile) {
    source = fileTree('src/main/java21') { include '**/*.java' }
    classpath = sourceSets.main.compileClasspath + files(tasks.named('compileJava').map { it.destinationDirectory })
    destinationDirectory = layout.buildDirectory.dir('classes/java/java21')
    options.release = 21
    options.encoding = 'UTF-8'
    dependsOn tasks.named('compileJava')
}
tasks.named('jar') {
    from(compileJava21.map { it.destinationDirectory }) { into 'META-INF/versions/21' }
}
tasks.named('test') {
    dependsOn compileJava21
    classpath = files(compileJava21.map { it.destinationDirectory }) + sourceSets.test.runtimeClasspath
}

// The SQLite floor test and its pinned driver version: see gradle/sqlite-floor.gradle.
apply from: rootProject.file('gradle/sqlite-floor.gradle')

// Run explicitly during release preparation, before building release artifacts.
// Increment both markers whenever message values change; commit the resulting snapshot.
// This task is deliberately not a dependency of build or processResources.
tasks.register('archiveMessages') {
    group = 'release'
    description = 'Archives bundled message defaults for release preparation, without rewriting history.'
    doLast {
        def resources = file('src/main/resources')
        def sources = ['en', 'zh'].collect { new File(resources, "messages_${it}.yml") }
        def versions = sources.collect { source ->
            def marker = source.getText('UTF-8') =~ /(?m)^_messages-version: ([0-9]+)\r?$/
            if (!marker.find()) {
                throw new GradleException("Missing integer _messages-version in ${source}")
            }
            Integer.parseInt(marker.group(1))
        }
        if (versions.toSet().size() != 1) {
            throw new GradleException('Bundled message versions must match in English and Chinese')
        }
        def archive = new File(resources, "messages/archive/${versions[0]}")
        if (archive.exists()) {
            if (!sources.every { source ->
                def snapshot = new File(archive, source.name)
                snapshot.isFile() && java.util.Arrays.equals(source.bytes, snapshot.bytes)
            }) {
                throw new GradleException("Message archive ${archive} differs from bundled defaults. "
                        + 'Do not overwrite history; increment both _messages-version markers and run archiveMessages.')
            }
            logger.lifecycle("Message archive v${versions[0]} is already identical; no changes")
            return
        }
        java.nio.file.Files.createDirectories(archive.toPath())
        sources.each { source ->
            java.nio.file.Files.copy(source.toPath(), new File(archive, source.name).toPath())
        }
        logger.lifecycle("Archived bundled messages as v${versions[0]}")
    }
}
