apply from: rootProject.file('gradle/bedrock.gradle')

configurations { sqliteFloor }

dependencies {
    api project(':craftapi')
    api('com.zaxxer:HikariCP:4.0.3') { exclude group: 'org.slf4j', module: 'slf4j-api' }
    api 'org.slf4j:slf4j-jdk14:2.0.19'
    api 'net.md-5:bungeecord-config:1.20-R0.2'
    api 'org.yaml:snakeyaml:2.7'
    compileOnly "org.xerial:sqlite-jdbc:${rootProject.versions.sqlite}"
    testImplementation "org.xerial:sqlite-jdbc:${rootProject.versions.sqlite}"
    sqliteFloor "org.xerial:sqlite-jdbc:${rootProject.versions.sqliteFloor}"
}

tasks.named('jar') {
    manifest.attributes('Automatic-Module-Name': 'com.github.games647.fastlogin.core')
}

def compileJava21 = tasks.register('compileJava21', JavaCompile) {
    source = fileTree('src/main/java21') { include '**/*.java' }
    classpath = sourceSets.main.compileClasspath + files(tasks.named('compileJava').map { it.destinationDirectory })
    destinationDirectory = layout.buildDirectory.dir('classes/java/java21')
    options.release = 21
    options.encoding = 'UTF-8'
    dependsOn tasks.named('compileJava')
}
tasks.named('jar') {
    from(compileJava21.map { it.destinationDirectory }) { into 'META-INF/versions/21' }
}
tasks.named('test') {
    dependsOn compileJava21
    classpath = files(compileJava21.map { it.destinationDirectory }) + sourceSets.test.runtimeClasspath
}

tasks.register('sqliteFloorTest', Test) {
    description = 'Run storage tests against the oldest supported server SQLite driver.'
    group = 'verification'
    dependsOn tasks.named('testClasses'), compileJava21
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = files(compileJava21.map { it.destinationDirectory }) +
        sourceSets.test.runtimeClasspath.filter { !it.name.startsWith('sqlite-jdbc-') } +
        configurations.sqliteFloor
    useJUnitPlatform()
    include '**/SQLiteStorageTest.class', '**/SQLStorageUpsertLockTest.class'
    systemProperty 'expected.sqlite.driver.version', rootProject.versions.sqliteFloor
    shouldRunAfter tasks.named('test')
}
tasks.named('check') { dependsOn tasks.named('sqliteFloorTest') }
