plugins {
    id 'base'
    id 'com.gradleup.shadow' version '9.6.1' apply false
}

group = 'com.github.games647'
version = '0.7.0'

ext.versions = [
    floodgate: '2.2.5-SNAPSHOT', geyser: '2.10.1-SNAPSHOT', geyserBaseApi: '1.0.3',
    fastutil: '8.5.16', cumulus: '1.1.2', protocolLib: '5.3.0',
    protocolSupport: 'master-66b494a8dd-1', datafixerupper: '7.1.15', netty: '4.1.103.Final',
    placeholderApi: '2.11.6', authme: '5.6.0', loginSecurity: '3.3.0',
    skinsRestorer: '15.11.0', bouncyCastle: '1.86', logit: '9e3581db27',
    passky: 'v3.0.0', xauth: '2.6', sqlite: '3.53.4.0', sqliteFloor: '3.36.0',
    mariadb: '3.5.10'
]

def commit = providers.exec {
    commandLine 'git', 'rev-parse', '--short=7', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() ?: 'unknown' }
ext.gitCommit = commit

def licensedSources = fileTree(rootDir) {
    include '**/*.java', '**/*.xml', '**/*.gradle'
    exclude '**/build/**', '**/target/**', '**/.gradle/**', '**/.worktrees/**',
        '**/src/main/resources/**', '**/src/test/resources/**', 'gradle/wrapper/**'
}
tasks.register('checkLicenseHeaders') {
    group = 'verification'
    inputs.files(licensedSources)
    doLast {
        def missing = licensedSources.files.findAll { file ->
            !file.getText('UTF-8').take(1500).contains('SPDX-License-Identifier: MIT')
        }
        if (missing) throw new GradleException('Missing MIT license header: ' +
            missing.collect { rootDir.toPath().relativize(it.toPath()) }.join(', '))
    }
}
tasks.named('check') { dependsOn tasks.named('checkLicenseHeaders') }

tasks.register('checkMavenVersionAlignment') {
    group = 'verification'
    inputs.file('pom.xml')
    inputs.property('gradleVersion', version.toString())
    inputs.property('sharedVersions', versions.toString())
    doLast {
        def pom = file('pom.xml').getText('UTF-8')
        def propertyNames = [
            floodgate: 'floodgate.version', geyser: 'geyser.version',
            geyserBaseApi: 'geyser-base-api.version', fastutil: 'fastutil.version',
            cumulus: 'cumulus.version', protocolLib: 'protocollib.version',
            protocolSupport: 'protocolsupport.version', datafixerupper: 'datafixerupper.version',
            netty: 'netty.version', placeholderApi: 'placeholderapi.version',
            authme: 'authme.version', loginSecurity: 'loginsecurity.version',
            skinsRestorer: 'skinsrestorer.version', bouncyCastle: 'bouncycastle.version',
            logit: 'logit.version', passky: 'passky.version', xauth: 'xauth.version',
            sqlite: 'sqlite.version', sqliteFloor: 'sqlite.floor.version', mariadb: 'mariadb.version'
        ]
        def expected = [revision: version.toString()]
        propertyNames.each { key, pomName -> expected[pomName] = versions[key] }
        expected.each { name, value ->
            def tag = java.util.regex.Pattern.quote(name)
            def match = pom =~ /<${tag}>\s*([^<]+?)\s*<\/${tag}>/
            if (!match.find() || match.group(1) != value) throw new GradleException(
                "Gradle ${name}=${value} differs from root pom.xml")
        }
    }
}
tasks.named('check') { dependsOn tasks.named('checkMavenVersionAlignment') }

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'checkstyle'
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven { url = uri('https://repo.opencollab.dev/main/') }
        maven { url = uri('https://repo.papermc.io/repository/maven-public/') }
        maven { url = uri('https://repo.codemc.io/repository/maven-public/') }
        maven { url = uri('https://repo.dmulloy2.net/repository/public/') }
        maven { url = uri('https://repo.extendedclip.com/content/repositories/placeholderapi') }
        // JitPack's ProtocolSupport POM declares master-SNAPSHOT although
        // the immutable requested coordinate is master-66b494a8dd-1.
        maven {
            url = uri('https://jitpack.io')
            content { excludeGroup 'com.github.ProtocolSupport' }
        }
        exclusiveContent {
            forRepository {
                maven {
                    url = uri('https://jitpack.io')
                    metadataSources { artifact() }
                }
            }
            filter { includeGroup 'com.github.ProtocolSupport' }
        }
        if (providers.gradleProperty('mavenRepoLocal').isPresent()) {
            maven { url = uri(providers.gradleProperty('mavenRepoLocal').get()) }
        }
    }

    def javaFloor = project.name == 'folia' ? 21 : (project.name in ['bungee', 'velocity'] ? 17 : 8)
    // Gradle's target-JVM variant selection would reject provided plugin APIs
    // compiled for newer JVMs and JUnit 6 for Java 8 modules. Maven compiles
    // against these on build JDK 21; only the packaged runtime is floor-checked.
    configurations.matching { it.name in ['compileClasspath', 'testCompileClasspath', 'testRuntimeClasspath'] }
        .configureEach {
            attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
        }
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(21) }
    }
    tasks.withType(JavaCompile).configureEach {
        options.release = javaFloor
        options.encoding = 'UTF-8'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'file.encoding', 'UTF-8'
    }
    checkstyle {
        toolVersion = '14.1.0'
        configFile = rootProject.file('checkstyle.xml')
        maxWarnings = 0
    }
    // Maven's check goal scans main sources; legacy test fixtures intentionally
    // have existing violations and are outside that gate.
    tasks.named('checkstyleTest') { enabled = false }
    tasks.named('checkstyleMain') { source = fileTree('src/main/java') { include '**/*.java' } }
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testImplementation 'org.mockito:mockito-core:5.23.0'
    }
    configurations.testImplementation.extendsFrom(configurations.compileOnly)

    def gitProperties = tasks.register('generateGitProperties') {
        def outputFile = layout.buildDirectory.file('generated/git-properties/git.properties')
        outputs.file(outputFile)
        inputs.property('commit', rootProject.gitCommit)
        doLast {
            def file = outputFile.get().asFile
            file.parentFile.mkdirs()
            file.text = "git.commit.id.abbrev=${rootProject.gitCommit.get()}\n"
        }
    }
    sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/git-properties'))
    tasks.named('processResources') {
        dependsOn gitProperties
        def replacements = [
            '${revision}': project.version.toString(),
            '${git.commit.id.abbrev}': rootProject.gitCommit.get(),
            '${project.artifactId}': "fastloginplus.${project.name}"
        ]
        inputs.properties(replacements)
        filesMatching(['plugin.yml', 'bungee.yml', 'velocity-plugin.json']) {
            filter { line -> replacements.inject(line) { value, entry -> value.replace(entry.key, entry.value) } }
        }
    }
    tasks.named('jar') {
        archiveBaseName = project.name == 'craftapi' ? 'FastLoginPlusCraftAPI' :
            "FastLoginPlus${project.name.capitalize()}"
        archiveVersion = "${project.version}-${rootProject.gitCommit.get()}"
        manifest {
            attributes('Multi-Release': 'true',
                'Implementation-Version': "${project.version}-${rootProject.gitCommit.get()}",
                'Implementation-Title': archiveBaseName.get())
        }
    }
    plugins.withId('com.gradleup.shadow') {
        def moduleName = project.name
        def modulePath = project.path
        def moduleVersion = project.version.toString()
        tasks.named('jar') { archiveClassifier = 'plain' }
        tasks.named('shadowJar') {
            archiveBaseName = tasks.named('jar').get().archiveBaseName.get()
            archiveVersion = "${project.version}-${rootProject.gitCommit.get()}"
            archiveClassifier = ''
            manifest.attributes('Multi-Release': 'true',
                'Implementation-Version': "${project.version}-${rootProject.gitCommit.get()}",
                'Implementation-Title': archiveBaseName.get())
        }
        tasks.named('assemble') { dependsOn tasks.named('shadowJar') }
        def verifyPluginJar = tasks.register('verifyPluginJar') {
            group = 'verification'
            dependsOn tasks.named('shadowJar')
            def jarFile = tasks.named('shadowJar').flatMap { it.archiveFile }
            inputs.file(jarFile)
            doLast {
                new java.util.zip.ZipFile(jarFile.get().asFile).withCloseable { zip ->
                    def names = zip.entries().collect { it.name }.toSet()
                    def required = ['git.properties',
                        'META-INF/versions/21/com/github/games647/fastlogin/core/scheduler/AsyncScheduler.class']
                    required += moduleName in ['bukkit', 'folia'] ? ['plugin.yml'] :
                        (moduleName == 'bungee' ? ['bungee.yml', 'org/sqlite/JDBC.class'] :
                            ['velocity-plugin.json', 'org/sqlite/JDBC.class',
                                'fastlogin/mariadb/jdbc/Driver.class'])
                    required.each { name ->
                        if (!names.contains(name)) throw new GradleException("${modulePath}: missing ${name}")
                    }
                    def manifest = new java.util.jar.Manifest(zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')))
                    if (manifest.mainAttributes.getValue('Multi-Release') != 'true') {
                        throw new GradleException("${modulePath}: missing Multi-Release manifest flag")
                    }
                    def descriptor = moduleName in ['bukkit', 'folia'] ? 'plugin.yml' :
                        (moduleName == 'bungee' ? 'bungee.yml' : 'velocity-plugin.json')
                    def descriptorText = zip.getInputStream(zip.getEntry(descriptor)).getText('UTF-8')
                    if (['${revision}', '${git.commit.id.abbrev}', '${project.artifactId}'].any {
                        descriptorText.contains(it)
                    } || !descriptorText.contains(moduleVersion)) {
                        throw new GradleException("${modulePath}: unfiltered ${descriptor}")
                    }
                    if (moduleName in ['bungee', 'velocity']) {
                        def drivers = zip.getInputStream(zip.getEntry('META-INF/services/java.sql.Driver'))
                            .getText('UTF-8').readLines().findAll { it && !it.startsWith('#') }
                        def expectedDrivers = moduleName == 'bungee' ? ['org.sqlite.JDBC'] :
                            ['org.sqlite.JDBC', 'fastlogin.mariadb.jdbc.Driver']
                        expectedDrivers.each { driver ->
                            if (!drivers.contains(driver) || !names.contains(driver.replace('.', '/') + '.class')) {
                                throw new GradleException("${modulePath}: missing JDBC service provider ${driver}")
                            }
                        }
                    }
                    zip.entries().each { entry ->
                        if (!entry.name.endsWith('.class') || entry.name.startsWith('META-INF/versions/') ||
                            entry.name.endsWith('/module-info.class') || entry.name == 'module-info.class') return
                        zip.getInputStream(entry).withCloseable { stream ->
                            byte[] header = new byte[8]
                            if (stream.read(header) == 8) {
                                int major = ((header[6] & 255) << 8) | (header[7] & 255)
                                if (major > javaFloor + 44) throw new GradleException(
                                    "${modulePath}: ${entry.name} exceeds Java ${javaFloor} (class ${major})")
                            }
                        }
                    }
                }
            }
        }
        tasks.named('check') { dependsOn verifyPluginJar }
    }

    // Inspect every class in a dependency that can enter a platform jar. The
    // module descriptor is exempt, as in Maven's enforceBytecodeVersion rule.
    def checkRuntimeBytecode = tasks.register('checkRuntimeBytecode') {
        dependsOn configurations.runtimeClasspath
        def runtime = configurations.runtimeClasspath
        inputs.files(runtime)
        doLast {
            int maxMajor = javaFloor + 44
            runtime.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                def file = artifact.file
                if (!file.name.endsWith('.jar')) return
                new java.util.zip.ZipFile(file).withCloseable { zip ->
                    zip.entries().each { entry ->
                        if (!entry.name.endsWith('.class') || entry.name.endsWith('/module-info.class') ||
                            entry.name == 'module-info.class' || entry.name.startsWith('META-INF/versions/')) return
                        zip.getInputStream(entry).withCloseable { stream ->
                            byte[] header = new byte[8]
                            if (stream.read(header) == 8) {
                                int major = ((header[6] & 255) << 8) | (header[7] & 255)
                                if (major > maxMajor) throw new GradleException(
                                    "${project.path}: ${artifact.moduleVersion.id} contains ${entry.name} " +
                                    "(class version ${major}; Java floor ${javaFloor})")
                            }
                        }
                    }
                }
            }
        }
    }
    tasks.named('check') { dependsOn checkRuntimeBytecode }
}
