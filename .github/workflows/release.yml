name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Test release tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Extract English changelog for this version
        run: python3 .github/scripts/release_tools.py notes "$RUNNER_TEMP/release-notes.md"

      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # Gradle must run on 25 for Fabric/Loom; the classic modules use the
          # 21 toolchain.
          java-version: |
            21
            25
          cache: 'gradle'

      - name: Build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: bash ./gradlew release --parallel --no-daemon --console=plain

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            build/release/*.jar

  modrinth:
    name: Modrinth (${{ matrix.platform }})
    needs: release
    if: github.repository == 'Hayston1001/FastLoginPlus' && vars.MODRINTH_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Fabric remains available on GitHub only.
        platform: [Bukkit, Folia, Bungee, Velocity]
    steps:
      - uses: actions/checkout@v7

      - name: Download the published GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir build/release

      - name: Publish platform to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
        run: python3 .github/scripts/release_tools.py modrinth "$PLATFORM"
