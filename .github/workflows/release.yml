name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # Gradle must run on 25 for Fabric/Loom; the classic modules use the
          # 21 toolchain.
          java-version: |
            21
            25
          cache: 'gradle'

      - name: Build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: bash ./gradlew release --parallel --no-daemon --console=plain

      - name: Extract changelog for this version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract the section between this version header and the next version header
          echo "# ChangeLog" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          sed -n "/^## ${TAG}/,/^## [v]/p" CHANGELOG.md | sed '$ d' >> /tmp/release-notes.md
          # If extraction failed (empty), fallback to a simple message
          if [ $(wc -l < /tmp/release-notes.md) -le 2 ]; then
            echo "# ChangeLog" > /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            echo "Release ${TAG}" >> /tmp/release-notes.md
            echo "" >> /tmp/release-notes.md
            echo "For detailed changes, see commits." >> /tmp/release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.md
          fail_on_unmatched_files: true
          files: |
            build/release/*.jar
