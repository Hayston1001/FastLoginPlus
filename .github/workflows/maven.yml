name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'maven'

      - name: Build and test
        # Geyser and Floodgate publish SNAPSHOT coordinates only, so no --no-snapshot-updates: the
        # default daily snapshot policy keeps a cached runner at most a day behind, instead of
        # serving whatever stale build happened to be in the cache.
        run: mvn package --batch-mode --threads 2.0C --strict-checksums
