name: Gradle Build

on:
  # Dependabot branches are already covered by the pull_request event below; skipping
  # the push run keeps a dependency bump from being built twice (same as the Maven
  # workflow did).
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches: [main]

jobs:
  # The build always includes Fabric now, so this is the single CI check.
  # Branch protection should require "build" (the old "Fabric" check no longer exists).
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Test release tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Set up build JDKs
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          # Gradle must run on 25 for Fabric/Loom; the classic modules use the
          # 21 toolchain. setup-java makes the last version the default.
          java-version: |
            21
            25
          cache: 'gradle'

      - name: Build and test
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: bash ./gradlew build --parallel --no-daemon --console=plain
