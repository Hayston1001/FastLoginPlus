name: Gradle Build

on:
  # Dependabot branches are already covered by the pull_request event below; skipping
  # the push run keeps a dependency bump from being built twice (same as the Maven
  # workflow did).
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'
          cache: 'gradle'

      - name: Build and test
        run: bash ./gradlew build --parallel --no-daemon --console=plain
