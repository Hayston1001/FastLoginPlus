name: Label issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label-bug:
    runs-on: ubuntu-latest
    steps:
      - name: Label bug reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [[ "${ISSUE_TITLE,,}" == '[bug]'* ]]; then
            gh issue edit "$ISSUE_NUMBER" --add-label bug
          fi
      - name: Label platforms
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const section = body.match(
              /^###\s+Deployment and platform versions[ \t]*:?[ \t]*\r?\n([\s\S]*?)(?=^#{1,3}\s|(?![\s\S]))/im
            );
            if (!section) return;

            const platforms = [
              { pattern: /\bbukkit(?=$|[^a-z_])/i, name: 'Bukkit', description: 'Bukkit server platform' },
              { pattern: /\bspigot(?=$|[^a-z_])/i, name: 'Spigot', description: 'Spigot server platform' },
              { pattern: /\bpaper(?=$|[^a-z_])/i, name: 'Paper', description: 'Paper server platform' },
              { pattern: /\bfolia(?=$|[^a-z_])/i, name: 'Folia', description: 'Folia server platform' },
              { pattern: /\b(?:bungeecord|bungee)(?=$|[^a-z_])/i, name: 'BungeeCord',
                description: 'BungeeCord proxy platform' },
              { pattern: /\bvelocity(?=$|[^a-z_])/i, name: 'Velocity', description: 'Velocity proxy platform' },
              { pattern: /\bwaterfall(?=$|[^a-z_])/i, name: 'Waterfall', description: 'Waterfall proxy platform' },
              { pattern: /\bfabric(?=$|[^a-z_])/i, name: 'Fabric', description: 'Fabric server platform' },
            ];
            const { owner, repo } = context.repo;
            const labels = [];
            for (const platform of platforms) {
              if (!platform.pattern.test(section[1])) continue;
              try {
                await github.rest.issues.getLabel({ owner, repo, name: platform.name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner, repo, name: platform.name, color: '1d76db',
                  description: platform.description
                });
              }
              labels.push(platform.name);
            }
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: context.issue.number, labels
              });
            }
