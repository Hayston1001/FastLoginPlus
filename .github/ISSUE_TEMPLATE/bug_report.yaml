name: Bug report
description: Report unexpected behavior
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post security vulnerabilities or exploit details publicly. Use GitHub's
        private vulnerability reporting if available. Remove passwords, tokens, forwarding
        secrets, proxy IDs, database credentials and personal information from all attachments.
        Never upload an authentication database.
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: List the steps, or explain the known conditions if the issue is intermittent.
    validations:
      required: true
  - type: input
    attributes:
      label: FastLoginPlus version
      description: Include the version and, for a development build, the commit or build source.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Deployment and platform versions
      description: State whether this is a standalone server or proxy and backend. List the software and exact version on each side, and where FLP is installed.
      placeholder: "Example: Velocity 3.x (proxy, FLP); Paper 1.x (backend, FLP)"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Other environment details
      description: "As relevant: Java versions, authentication plugin and version, forwarding mode, storage, Floodgate, Fabric mods, and other plugins."
  - type: textarea
    attributes:
      label: Logs and configuration
      description: Share relevant sanitized configuration and logs, ideally from both sides of one attempt with timestamps. Include a link if they are long. Remove secrets and personal data first.
      render: text
  - type: textarea
    attributes:
      label: Additional context
      description: "What have you tried? Does it happen on the latest stable release or a development build? If not tested, say so. For login issues, describe the account state and player-visible message."
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
