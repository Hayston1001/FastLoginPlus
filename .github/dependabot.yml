version: 2

updates:
  # Keep workflow actions current. Major action upgrades stay in separate PRs so
  # runner and permission changes can be reviewed independently.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # Gradle's version catalog owns shared dependency versions for all modules.
  #
  # This entry is an ALLOW list, not an ignore list: only the dependencies named
  # below are followed automatically.  Everything else is pinned on purpose,
  # because the version that decides at runtime is the user's server or plugin,
  # not ours:
  #
  #   - platform APIs: paper-api, folia-api, velocity-api, net.md-5:bungeecord-*
  #     (moving the compile baseline is a reviewed change -- a partial bump splits
  #     bungeecord-api from the proxy the user actually runs)
  #   - other plugins' hook APIs: ProtocolLib, AuthMe, SkinsRestorer,
  #     PlaceholderAPI, Geyser/Floodgate, Passky, LoginSecurity, xAuth, ...
  #   - the fixed JARs checked into */lib and the shared io.netty version
  #     (provided for bukkit/folia, where the server supplies netty)
  #
  # Pinned values that a bot must never bump (the proxy-bundled guava/gson/slf4j baselines,
  # the SQLite compatibility floor) live in gradle/*.gradle files instead of the catalog.
  # Dependabot fetches only build.gradle, settings.gradle, gradle.properties and
  # libs.versions.toml, so it cannot see or propose those versions. Keep it that way.
  #
  # When a library that gets shaded into a JAR, or a build plugin, is added to a
  # build, add it here as well -- otherwise it will never be updated.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"

    # The default limit of 5 is enough once the updates are grouped; the point of
    # the allow list is that the candidate set stays small and deliberate.
    open-pull-requests-limit: 5

    allow:
      # Shaded into the JARs: the only dependencies where a CVE is ours to fix.
      - dependency-name: "com.zaxxer:HikariCP"
      - dependency-name: "org.slf4j:*"
      - dependency-name: "org.yaml:snakeyaml"
      - dependency-name: "com.google.code.gson:gson"
      - dependency-name: "com.google.guava:guava"
      - dependency-name: "org.xerial:sqlite-jdbc"
      - dependency-name: "org.mariadb.jdbc:mariadb-java-client"

      # Build tooling.
      - dependency-name: "com.gradleup.shadow"
      - dependency-name: "org.gradle.toolchains.foojay-resolver-convention"
      - dependency-name: "com.puppycrawl.tools:checkstyle"

      # Tests.
      - dependency-name: "org.junit.jupiter:*"
      - dependency-name: "org.mockito:*"
      - dependency-name: "org.bouncycastle:*"

    # The groups are pattern-based and mutually exclusive: Dependabot assigns a
    # dependency to the first group whose rules it matches, and which
    # production/development bucket it puts a Gradle plugin in is not something we
    # control -- so the split is spelled out here instead of relying on that
    # classification. Majors stay out of every group (update-types) and arrive
    # as individual PRs for review.
    groups:
      build-tooling:
        applies-to: "version-updates"
        patterns:
          - "com.gradleup.shadow"
          - "org.gradle.toolchains.foojay-resolver-convention"
          - "com.puppycrawl.tools:checkstyle"
        update-types:
          - "minor"
          - "patch"

      test-dependencies:
        applies-to: "version-updates"
        patterns:
          - "org.junit.jupiter:*"
          - "org.mockito:*"
          - "org.bouncycastle:*"
        update-types:
          - "minor"
          - "patch"

      shaded-libraries:
        applies-to: "version-updates"
        patterns:
          - "com.zaxxer:HikariCP"
          - "org.slf4j:*"
          - "org.yaml:snakeyaml"
          - "com.google.code.gson:gson"
          - "com.google.guava:guava"
          - "org.xerial:sqlite-jdbc"
          - "org.mariadb.jdbc:mariadb-java-client"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # HikariCP 5+ dropped the Java 8 support required by core and Bukkit.
      - dependency-name: "com.zaxxer:HikariCP"
        update-types: ["version-update:semver-major"]
